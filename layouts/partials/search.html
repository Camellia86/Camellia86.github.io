<div class="writing-search" hidden>
  <label for="writing-search">Find a note</label>
  <div class="search-field">
    <span aria-hidden="true">⌕</span>
    <input type="search" id="writing-search" placeholder="Search titles, topics, and summaries…" autocomplete="off">
    <button type="button" id="clear-search" hidden>Clear</button>
  </div>
  <p id="search-status" role="status" aria-live="polite"></p>
</div>
