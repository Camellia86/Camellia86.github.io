<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="light">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}page-home{{ else }}page-inner{{ end }}">
    <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
