baseURL = 'https://camellia86.github.io/'
locale = 'en-US'
title = 'Camellia86'
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  author = 'Zixiang Ni'
  brand = 'Camellia86'
  description = 'Research notes by Zixiang Ni on ML and DL theory, scaling laws, post-training, embodied intelligence, AI for Science, finance, and mathematics.'
  tagline = 'My research spans ML & DL theory, scaling laws, post-training, embodied intelligence, and AI for Science. I am also interested in finance and mathematics.'
  github = 'https://github.com/Camellia86'
  accent = '#b4485a'

[outputs]
  home = ['HTML', 'RSS', 'Comments']
  section = ['HTML', 'RSS']

[outputFormats.Comments]
  mediaType = 'application/json'
  baseName = 'comments-index'
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = true
    style = 'github-dark'
    lineNos = false

[taxonomies]
  tag = 'tags'

[privacy]
  [privacy.youtube]
    privacyEnhanced = true
